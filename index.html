<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexo Essentials | High-Utility Daily Goods Lebanon</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><path d='M30 70 V30 L52 56 V30 H70 V70 L48 44 V70 Z' fill='%2338bdf8'/><path d='M48 44 L70 70 H52 Z' fill='%230284c7'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-3.5 flex items-center justify-between gap-4">
            <a href="#" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-sky-400">
                    <svg class="w-6 h-6" viewBox="0 0 100 100" fill="none"><path d="M30 70 V30 L52 56 V30 H70 V70 L48 44 V70 Z" fill="currentColor"/></svg>
                </div>
                <div>
                    <span class="font-black text-xl text-white">NEXO <span class="text-sky-400 font-light text-base">ESSENTIALS</span></span>
                    <span class="block text-[9px] font-bold text-slate-400 tracking-widest uppercase -mt-1">MySQL Database Connected</span>
                </div>
            </a>
            <div class="flex items-center gap-3">
                <button onclick="toggleCurrency()" class="text-xs bg-slate-800 text-sky-300 border border-slate-700 px-3 py-1.5 rounded-xl font-semibold">
                    <span id="currencyLabel">USD ($)</span>
                </button>
                <button onclick="toggleCart()" class="relative p-2.5 bg-sky-600 hover:bg-sky-500 text-white rounded-xl shadow-md flex items-center gap-2">
                    <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                    <span id="cartCount" class="bg-white text-slate-900 font-extrabold text-xs px-2 py-0.5 rounded-full">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- CATALOG -->
    <main class="max-w-7xl mx-auto px-4 py-10 flex-1 w-full">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-black text-white">Product Catalog <span id="itemCountBadge" class="text-xs px-2.5 py-0.5 rounded-full bg-slate-800 text-sky-400">0 Products</span></h2>
        </div>
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- ADMIN MODAL -->
    <div id="adminModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div onclick="closeAdminModal()" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md"></div>
        <div class="relative bg-slate-900 border border-slate-800 w-full max-w-3xl rounded-3xl p-6 shadow-2xl z-10 max-h-[90vh] overflow-y-auto space-y-6">
            <div id="adminAuthContainer" class="text-center space-y-4 py-8">
                <h3 class="text-xl font-bold text-white">MySQL Admin Login</h3>
                <input type="password" id="adminPassInput" placeholder="Passcode (76896635)" class="px-4 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white">
                <button onclick="verifyAdminPin()" class="px-5 py-2 bg-sky-500 text-slate-950 font-bold text-xs rounded-xl">Login</button>
            </div>
            <div id="adminDashboardContainer" class="hidden space-y-6">
                <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                    <h3 class="font-black text-white">MySQL Admin Dashboard</h3>
                    <button onclick="closeAdminModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <!-- Add Product -->
                <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
                    <h4 class="text-xs font-bold uppercase text-sky-400">Add Product to MySQL</h4>
                    <input type="text" id="newProdName" placeholder="Product Title" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white">
                    <select id="newProdCategory" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white">
                        <option value="tech">Desk & Tech</option>
                        <option value="utility">Daily Utility</option>
                        <option value="comfort">Comfort & Home</option>
                    </select>
                    <input type="number" step="0.5" id="newProdPrice" placeholder="Price ($ USD)" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white">
                    <input type="file" id="newProdFile" accept="image/*" class="w-full text-xs text-slate-300 bg-slate-800 border border-slate-700 rounded-xl">
                    <textarea id="newProdDesc" placeholder="Description..." class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white"></textarea>
                    <button onclick="addNewProduct()" class="w-full py-2.5 bg-emerald-600 text-white font-bold text-xs rounded-xl">Save to MySQL Database</button>
                </div>
                <div id="adminProductList" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        const API_BASE_URL = 'http://localhost:3000/api'; // Change to your deployed backend URL when live
        const LBP_RATE = 89500;
        let PRODUCTS = [];
        let deliveryFee = 2.00;
        let showLbp = false;
        let cart = [];

        async function fetchStoreData() {
            try {
                const res = await fetch(`${API_BASE_URL}/store`);
                const data = await res.json();
                PRODUCTS = data.products || [];
                if (data.settings && data.settings.delivery_fee) {
                    deliveryFee = parseFloat(data.settings.delivery_fee);
                }
                renderProducts();
                if(!document.getElementById('adminDashboardContainer').classList.contains('hidden')) {
                    renderAdminInventory();
                }
            } catch(e) { console.error('Database fetch error:', e); }
        }

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            fetchStoreData();
            setInterval(fetchStoreData, 4000); // Live sync polling every 4 seconds across phone & PC
            checkAdminHash();
            window.addEventListener('hashchange', checkAdminHash);
        });

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            if(!grid) return;
            grid.innerHTML = '';
            document.getElementById('itemCountBadge').textContent = `${PRODUCTS.length} Products`;

            PRODUCTS.forEach(p => {
                const priceFormatted = showLbp ? `${(p.price_usd * LBP_RATE).toLocaleString()} LBP` : `$${parseFloat(p.price_usd).toFixed(2)} USD`;
                const card = document.createElement('div');
                card.className = "bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden shadow-lg flex flex-col justify-between";
                card.innerHTML = `
                    <div class="aspect-video bg-slate-950 overflow-hidden"><img src="${p.image}" class="w-full h-full object-cover"></div>
                    <div class="p-4 space-y-2">
                        <h3 class="font-extrabold text-sm text-white">${p.name}</h3>
                        <p class="text-xs text-slate-400">${p.description}</p>
                    </div>
                    <div class="p-4 pt-0 flex items-center justify-between border-t border-slate-800 mt-2">
                        <span class="text-sm font-black text-sky-400">${priceFormatted}</span>
                        <button onclick="alert('Added to cart')" class="px-3 py-1.5 bg-sky-500 text-slate-950 font-extrabold text-xs rounded-xl">Add</button>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        function checkAdminHash() {
            if(window.location.hash === '#admin') document.getElementById('adminModal').classList.remove('hidden');
            else document.getElementById('adminModal').classList.add('hidden');
        }
        function closeAdminModal() { window.location.hash = ''; }
        function verifyAdminPin() {
            if(document.getElementById('adminPassInput').value === '76896635') {
                document.getElementById('adminAuthContainer').classList.add('hidden');
                document.getElementById('adminDashboardContainer').classList.remove('hidden');
                renderAdminInventory();
            } else alert('Incorrect Passcode');
        }

        function addNewProduct() {
            const name = document.getElementById('newProdName').value;
            const category = document.getElementById('newProdCategory').value;
            const priceUsd = parseFloat(document.getElementById('newProdPrice').value);
            const description = document.getElementById('newProdDesc').value;
            const fileInput = document.getElementById('newProdFile');

            const reader = new FileReader();
            reader.onload = async function(e) {
                const newObj = {
                    id: 'n_' + Date.now(),
                    name, category, priceUsd,
                    rating: 5.0, reviews: 1,
                    image: e.target.result || 'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=600',
                    badge: 'New ✨',
                    description
                };
                await fetch(`${API_BASE_URL}/products`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newObj)
                });
                fetchStoreData();
                alert('Saved to MySQL Database!');
            };
            if(fileInput.files[0]) reader.readAsDataURL(fileInput.files[0]);
            else reader.onload({ target: { result: 'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=600' } });
        }

        async function deleteProduct(id) {
            if(confirm('Delete from MySQL?')) {
                await fetch(`${API_BASE_URL}/products/${id}`, { method: 'DELETE' });
                fetchStoreData();
            }
        }

        function renderAdminInventory() {
            const list = document.getElementById('adminProductList');
            list.innerHTML = '';
            PRODUCTS.forEach(p => {
                list.innerHTML += `
                    <div class="flex justify-between items-center p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs">
                        <span>${p.name} ($${p.price_usd})</span>
                        <button onclick="deleteProduct('${p.id}')" class="px-2.5 py-1 bg-red-900 text-white rounded">Delete</button>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
